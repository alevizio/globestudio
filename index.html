    <!-- A transparent embed must paint see-through from the first frame.
         Without this, the app's dark default shows for a tick before the React
         bundle applies transparency — a black flash. This sets it transparent
         synchronously, before the bundle. Crucially it also forces a light
         used-color-scheme: the app declares color-scheme: dark, which makes
         Chromium paint an opaque UA backdrop behind the iframe document that no
         host can override cross-origin — so the embed must drop it from inside.
         Matches both ?transparent=1 and ?c=…{"transparent":true}. -->
    <style>
      html[data-embed-transparent],
      html[data-embed-transparent] body,
      html[data-embed-transparent] #root { background: transparent !important; }
    </style>
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, "");
          if (!/(^|\/)embed$/.test(p)) return;
          var s = location.search;
          var decoded = s;
          try { decoded = decodeURIComponent(s); } catch (e) {}
          var wantsTransparent =
            /[?&]transparent=(1|true)\b/.test(s) ||
            /"transparent"\s*:\s*true/.test(decoded);
          if (!wantsTransparent) return;
          var de = document.documentElement;
          de.setAttribute("data-embed-transparent", "");
          de.style.background = "transparent";
          // Same-origin embeds (our teaser/showcase iframes) are made see-through
          // by the host setting the iframe element's color-scheme: normal, so the
          // host background shows through — forcing "only light" here would paint a
          // white box over it. Only cross-origin / top-level embeds need the forced
          // light scheme to drop Chromium's opaque dark backdrop on a light host.
          var sameOrigin = false;
          try {
            sameOrigin = window.top !== window.self &&
              window.parent.location.origin === location.origin;
          } catch (e) {}
          if (!sameOrigin) {
            de.style.colorScheme = "only light";
            var meta = document.querySelector('meta[name="color-scheme"]');
            if (meta) meta.setAttribute("content", "only light");
          }
        } catch (e) {}
      })();
    </script>

    <!-- Preconnect early so the @font-face fetch (declared below) can
         skip TLS + DNS handshake latency. Saves ~150-300ms on slow
         mobile connections where the font CDN is otherwise discovered
         late in the critical path. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Google Search Console verification.
         No analytics script — GSC reads only the search-side data
         (queries, impressions, clicks). Generate the token at:
           https://search.google.com/search-console
         → Add property → URL prefix → https://globestudio.app
         → Verification method: HTML tag → paste the content value below.
         Alternative: verify via DNS TXT (Vercel → Domains → DNS Records).
         No cookies, no third-party script. -->
    <meta name="google-site-verification" content="8znCU5YBYB_VGR4N-jjhZPpIwT8f1bMr4R2OWtscofc" />

    <!-- RSS feed of recent shipped work — auto-discovered by feed
         readers (Feedly, NetNewsWire, Reeder, Inoreader, etc.). -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="Globestudio changelog"
      href="/changelog.xml"
    />

    <!-- Critical CSS for the LCP element. .map-background-placeholder
         is the full-viewport <div> rendered inside the Suspense fallback
         while the lazy GlobeBackground chunk resolves — i.e. the first
         meaningful paint on mobile (before three.js + dotted-map load).
         Inlining ~600 bytes here skips the round-trip to fetch the main
         CSS bundle before LCP fires. See
         docs/research/2026-05-mobile-lcp-optimization.md. -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b0c;
        --text: #f6f2ea;
      }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body { overflow: hidden; }
      .map-background-placeholder {
        position: fixed;
        inset: 0;
        z-index: 0;
        background:
          radial-gradient(circle at 60% 50%, rgba(120, 140, 200, 0.04) 0%, transparent 38%),
          var(--bg);
      }
    </style>

    <!-- Geist Pixel (Square variant) — Vercel's open-source pixel typeface,
         hosted on GitHub. Five shape variants exist; Square pairs cleanest
         with the pixelarticons icon set. Single weight (no bold), so the
         font-weight: 700 rules across the app fall back to 400 gracefully. -->
    <style>
      @font-face {
        font-family: "Geist Pixel";
        src: url("https://cdn.jsdelivr.net/gh/vercel/geist-pixel-font@main/fonts/webfonts/GeistPixel-Square.woff2") format("woff2");
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
    </style>
  </head>
