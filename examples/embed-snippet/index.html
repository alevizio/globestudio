<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Globestudio embed — minimum viable</title>
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        --bg: #0a0a0a;
        --panel: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.16);
        --text: #f6f2ea;
        --muted: #a8a39b;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; }
      body { display: flex; flex-direction: column; align-items: center; padding: 48px 24px; gap: 32px; }
      h1 { font-size: 28px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
      p { color: var(--muted); max-width: 580px; line-height: 1.6; margin: 0; text-align: center; }
      .embed-frame {
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16/9;
        border-radius: 16px;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid var(--border);
      }
      .embed-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
      .preset-picker {
        display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        max-width: 760px;
      }
      .preset-button {
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font: inherit; font-size: 13px;
        cursor: pointer;
        transition: background 180ms, border-color 180ms;
      }
      .preset-button:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.28); }
      .preset-button.is-active { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.4); }
      code { background: rgba(255, 255, 255, 0.08); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
      footer { color: var(--muted); font-size: 13px; margin-top: 24px; }
      footer a { color: var(--text); }
    </style>
  </head>
  <body>
    <h1>Globestudio — minimum viable embed</h1>
    <p>
      One <code>&lt;iframe&gt;</code>, zero npm, no build step. Pick a preset
      below; the iframe swaps to that look. Same trick works in Webflow,
      Framer, Notion, Substack, plain HTML.
    </p>

    <div class="embed-frame">
      <!--
        The whole integration is this one tag. Swap `look=halftone` for any
        preset id (default, halftone, risograph, aurora, bloom, etc.) to
        change the look. Width/height come from the parent .embed-frame's
        CSS — aspect-ratio: 16/9 makes it responsive.
      -->
      <iframe
        id="globestudio-embed"
        src="https://globestudio.app/embed?look=halftone&source=example-snippet"
        loading="lazy"
        title="Globestudio dotted globe"
      ></iframe>
    </div>

    <nav class="preset-picker" aria-label="Preset switcher">
      <button class="preset-button is-active" data-look="halftone">Halftone</button>
      <button class="preset-button" data-look="risograph">Risograph</button>
      <button class="preset-button" data-look="newsprint">Newsprint</button>
      <button class="preset-button" data-look="bayer">Bayer</button>
      <button class="preset-button" data-look="aurora">Aurora</button>
      <button class="preset-button" data-look="iridescent">Iridescent</button>
      <button class="preset-button" data-look="pixel">Pixel</button>
      <button class="preset-button" data-look="bloom">Bloom</button>
      <button class="preset-button" data-look="metal">Metal</button>
      <button class="preset-button" data-look="crt">CRT</button>
    </nav>

    <footer>
      Built with <a href="https://globestudio.app/">Globestudio</a> · MIT
    </footer>

    <script>
      // Swap the iframe src when a preset chip is clicked. The browser
      // re-renders the iframe with the new look; cached HTTP + Vercel edge
      // means the swap typically takes <200ms.
      const iframe = document.getElementById("globestudio-embed");
      const buttons = document.querySelectorAll(".preset-button");
      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const look = button.dataset.look;
          iframe.src = `https://globestudio.app/embed?look=${look}&source=example-snippet`;
          buttons.forEach((b) => b.classList.toggle("is-active", b === button));
        });
      });
    </script>
  </body>
</html>
