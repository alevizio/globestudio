<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Globestudio</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100vh; background: #0a0a0c; }
    body { display: flex; flex-direction: column; }
    iframe {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      display: block;
      color-scheme: dark;
    }
    /* "Use my Figma colors" — a thin strip of the file's color variables.
       Hidden until variables arrive. Clicking one recolors the globe dots. */
    #brandbar {
      flex: none;
      display: none;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      padding: 7px 10px;
      background: rgba(10, 10, 12, 0.92);
      font: 11px ui-sans-serif, system-ui, sans-serif;
      color: #aab4c8;
      z-index: 2;
    }
    #brandbar.show { display: flex; }
    #brandbar .bswatch {
      width: 20px; height: 20px;
      border-radius: 5px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 0;
      cursor: pointer;
    }
    #brandbar .bswatch:hover { transform: scale(1.12); }
  </style>
</head>
<body>
  <div id="brandbar" aria-label="Your Figma colors"></div>
  <iframe
    id="embed"
    title="Globestudio studio"
    allow="cross-origin-isolated"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
  <script>
    // Load the embed with a per-open cache-buster. The Figma desktop app's
    // embedded browser otherwise caches the /embed response (headers and all)
    // on disk across restarts, which once pinned a stale Content-Security-
    // Policy. A unique query param guarantees a fresh fetch each open; the
    // server sends no-store, so this never bloats the cache.
    var embedEl = document.getElementById("embed");
    function buildEmbedSrc() {
      return "https://globestudio.app/?plugin=figma&app=1&cb=" + Date.now();
    }
    embedEl.src = buildEmbedSrc();

    // Ask the sandbox for the file's local color variables.
    parent.postMessage({ pluginMessage: { type: "get-variables" } }, "*");

    function renderVariables(variables) {
      var bar = document.getElementById("brandbar");
      bar.innerHTML = "";
      if (!variables || !variables.length) {
        bar.classList.remove("show");
        return;
      }
      var label = document.createElement("span");
      label.textContent = "Your colors:";
      bar.appendChild(label);
      variables.slice(0, 24).forEach(function (v) {
        var b = document.createElement("button");
        b.className = "bswatch";
        b.style.background = v.hex;
        b.title = v.name + ": apply to dots";
        b.onclick = function () {
          embedEl.contentWindow.postMessage({ type: "globestudio-set-dot-color", hex: v.hex }, "https://globestudio.app");
        };
        bar.appendChild(b);
      });
      bar.classList.add("show");
    }

    // Bridge between the embed iframe (globestudio.app) and the Figma
    // plugin sandbox (code.js).
    //
    // Messages we expect from the embed:
    //   { type: "globestudio-insert", bytes: ArrayBuffer, width, height }
    //   { type: "globestudio-resize", height }
    //
    // We forward via parent.postMessage({ pluginMessage: ... }) which is
    // how a Figma plugin's UI talks to its sandboxed code.
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (!data || typeof data !== "object") return;

      // Defensive origin check — only accept messages from the embed origin.
      // event.origin is the empty string for the parent (Figma), and the
      // embed URL for messages from the iframe.
      if (event.origin && event.origin !== "https://globestudio.app") return;

      // Color variables pushed from the plugin sandbox (origin is empty).
      if (data.pluginMessage && data.pluginMessage.type === "variables") {
        renderVariables(data.pluginMessage.variables);
        return;
      }

      if (data.type === "globestudio-insert") {
        // bytes is a Uint8Array transferred from the embed; structured clone
        // copies it into the plugin sandbox cleanly.
        parent.postMessage(
          {
            pluginMessage: {
              type: "insert",
              bytes: data.bytes,
              svg: data.svg || null,
              width: data.width,
              height: data.height,
              presetName: data.presetName || "Globestudio",
            },
          },
          "*"
        );
      } else if (data.type === "globestudio-resize") {
        // The embed reports its desired height; we forward to the sandbox
        // which can resize the panel via figma.ui.resize(width, height).
        parent.postMessage(
          { pluginMessage: { type: "resize", height: data.height } },
          "*"
        );
      }
    });
  </script>
</body>
</html>
