name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests + build + bundle budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Launch mode, the value production ships with (1 = teaser). The
          # Lighthouse job audits this dist, so it must be the app.
          VITE_TEASER: "0"

      - name: Check bundle size
        run: npm run check:bundle

      - name: Upload built artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    # The browser tests render the globe in software (no GPU on the runner),
    # so one machine took about an hour and heavy tests hit their timeouts.
    # Three shards run side by side.
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test --shard=${{ matrix.shard }}/3

  packages:
    name: Packages (mcp, react, element)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/*/package-lock.json

      # The contract test decodes every URL the server emits with the app's
      # own share-config parser, so drift between the two fails here.
      - name: MCP server (build + contract test)
        working-directory: packages/mcp
        run: |
          npm ci
          npm run build
          npm test

      - name: React component (build)
        working-directory: packages/react
        run: |
          npm ci
          npm run build

      # No build step: the package ships its source. Check that it parses
      # and that the tarball npm would publish is valid.
      - name: Web component (syntax + pack)
        working-directory: packages/web-component
        run: |
          node --check index.js
          npm pack --dry-run

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
