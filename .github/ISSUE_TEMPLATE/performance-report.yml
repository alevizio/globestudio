name: 🐢 Performance / browser report
description: Lag, freezes, crashes, or visual glitches that aren't strictly bugs
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Worlddots is graphics-heavy. We treat performance as a launch blocker,
        not a polish issue — please file these. The more detail, the better.

  - type: textarea
    id: symptom
    attributes:
      label: What did you see?
      description: Lag while dragging? Stuck at low FPS? Black canvas? Browser tab crashed?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: How bad is it?
      options:
        - "Annoying but usable"
        - "Hard to use in this state"
        - "Tab freezes or crashes"
    validations:
      required: true

  - type: textarea
    id: settings
    attributes:
      label: Settings when it happened
      description: Use the URL from the address bar if you applied a look — that's the easiest way to share state. Or list the panel values that matter (shape, density, size, shader, etc.).
      placeholder: |
        URL: https://worlddots.app/looks/wireframe
        Density: 90, Size: 16, Shader: edge, Animations: on
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: Chrome 142, Safari 18.4, Firefox 137…
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS + version
      placeholder: macOS 15.4, Windows 11, iOS 18.4…
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device + GPU (if you know it)
      description: macOS — Apple menu → About This Mac → More Info. Windows — Task Manager → Performance → GPU. Doesn't need to be exact.
      placeholder: MacBook Pro M1 (Apple M1), Pixel 8 (Mali), iPhone 15 (A17)…
    validations:
      required: true

  - type: dropdown
    id: viewport
    attributes:
      label: Viewport
      options:
        - "Desktop, ~1280–1920 wide"
        - "Desktop, ~2560+ wide / Retina"
        - "Tablet"
        - "Phone, portrait"
        - "Phone, landscape"
    validations:
      required: true

  - type: textarea
    id: fps
    attributes:
      label: Measured FPS (optional)
      description: Chrome → DevTools → Performance → Record 3–5 seconds → frame rate. Even a rough number helps.
      placeholder: "Hovering ~15fps while dragging, ~30fps idle"

  - type: textarea
    id: recording
    attributes:
      label: Screen recording (optional)
      description: A 5-second clip is worth a thousand bug reports.
